---
layout: page
title: Publications
---

<style>
.pub-filter select {
    border: 1px solid #74C3FE;
    border-radius: 0;
    background-color: rgba(116, 195, 254, 0.6);
    color: inherit;
    width: auto;
    cursor: pointer;
}

.pub-filter select:focus {
    outline: solid .12rem #74C3FE;
    outline-offset: -.12rem;
}
</style>

<div class="pub-filter">

  <label for="pubYear">Year: </label>

  <select id="pubYear" onchange="filterPublications(this.value)">
    <option value="all">All</option>

    {% assign current_year = site.time | date: "%Y" | plus: 0 %}

    {% for year in (1994..current_year) reversed %}
      <option value="{{ year }}">{{ year }}</option>
    {% endfor %}

  </select>

</div>
<b><i><font color="green"><span id="pubNumber">0</span></font></i></b>&nbsp;records

<p style="font-size:14px">
  <em>For more details, see our page on
    <a href="https://scholar.google.ca/citations?user=Svk1wjsAAAAJ&hl=en">
      Google Scholar
    </a>
  </em>
</p>

<div id="publication-list">

  {% include all-publications.html %}

</div>

<script>

function filterPublications(year) {

  var publications = document.querySelectorAll(
    '#publication-list p'
  );

  var count = 0;

  publications.forEach(function(pub) {

    if (year === 'all' || pub.classList.contains(year)) {

      pub.style.display = '';
      count++;

    } else {

      pub.style.display = 'none';

    }

  });
  document.getElementById('pubNumber').textContent = count;

}

// Initialize count when page loads
document.addEventListener('DOMContentLoaded', function() {
  filterPublications('all');
});

</script>
